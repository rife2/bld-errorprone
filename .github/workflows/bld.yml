name: bld-ci

on: [push, pull_request, workflow_dispatch]

jobs:
  build-bld-project:
    strategy:
      matrix:
        java-version: [17, 21, 25]
        os: [ubuntu-latest, windows-latest, macos-latest]

    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout source repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up JDK ${{ matrix.java-version }}
        uses: actions/setup-java@v6
        with:
          distribution: "zulu"
          java-version: ${{ matrix.java-version }}

      - name: Cache bld dependencies
        id: cache-bld
        uses: actions/cache@v6
        with:
          path: |
            examples/lib
            lib
          key: ${{ runner.os }}-bld-java${{ matrix.java-version }}-lib

      - name: Compile example source code
        working-directory: example
        run: ./bld --auto-download-purge clean compile

      - name: Check example with ErrorProne
        id: errorprone
        continue-on-error: true
        working-directory: example
        run: ./bld errorprone

      - name: Verify example failure
        if: always() && steps.errorprone.outcome != 'failure'
        run: echo "The example ErrorProne step should have failed" && exit 1

      - name: Compile source code
        run: ./bld clean compile

      - name: Run tests
        id: tests
        run: ./bld test

      - name: Run reporter
        if: always() && steps.tests.outcome == 'failure'
        run: ./bld --offline reporter --all
